<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KalaNidhi</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Linked CSS -->
    <link rel="stylesheet" href="logincss.css">
    
</head>
<body class="auth-page-body">

    <div class="auth-page-container">
        <!-- Header Brand Info -->
        <div class="auth-page-header">
            <a href="index.html" class="auth-brand">
                <img src="assets/logo.png.jpeg" alt="KalaNidhi Logo" class="brand-logo-img">
                <span class="brand-title">कला NIDHI</span>
            </a>
            <h2>Welcome Back</h2>
            <p>Log in to manage your crafts or explore products.</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginEmail">EMAIL ADDRESS</label>
                <input type="email" id="loginEmail" placeholder="e.g. artisan@kalanidhi.org" required>
            </div>
            
            <div class="form-group">
                <label for="loginPassword">PASSWORD</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit full-btn">Log In</button>
        </form>

        <!-- Redirect to Sign Up -->
        <div class="auth-page-footer">
            <p>Don't have an account? <a href="signup.html">Sign Up here</a></p>
            <p><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a></p>
        </div>
    </div>

    <!-- Linked JavaScript -->
     <script src="script.js"></script>
</body>
</html>
